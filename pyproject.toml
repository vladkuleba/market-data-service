[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-service"
version = "0.0.0"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "psycopg[binary]==3.3.4",
]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "pytest==9.1.1",
    "httpx2==2.9.1",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: PEP 8 style errors
    "W",   # pycodestyle: whitespace warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import order
    "UP",  # pyupgrade: outdated syntax for the target version
    "B",   # bugbear: likely bugs, e.g. mutable default arguments
]
